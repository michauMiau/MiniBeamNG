name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The script uses only the standard library, so several versions are
        # worth checking without pinning to one.
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Check the script actually runs
        run: |
          python minibeamng.py --help
          # A missing source must fail loudly instead of half-copying.
          if python minibeamng.py /nonexistent/beamng; then
            echo "::error::expected a non-zero exit for a missing source folder"
            exit 1
          fi

      - name: Run tests
        run: python -m unittest discover -s tests -v

  lint:
    name: Pylint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pylint
        run: |
          python -m pip install --upgrade pip
          pip install pylint

      - name: Run pylint
        run: pylint $(git ls-files '*.py')
